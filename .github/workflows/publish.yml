name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          pip install piper-tts==1.8.0 pyyaml lameenc==1.9.0

      - name: Get the German voice
        id: voice
        run: |
          mkdir -p voice
          HF=https://huggingface.co/rhasspy/piper-voices/resolve/main/de/de_DE/thorsten/high
          if curl -fsSL -o voice/de_DE-thorsten-high.onnx "$HF/de_DE-thorsten-high.onnx" \
             && curl -fsSL -o voice/de_DE-thorsten-high.onnx.json "$HF/de_DE-thorsten-high.onnx.json"; then
            echo "name=de_DE-thorsten-high" >> "$GITHUB_OUTPUT"
          else
            echo "High-quality voice unavailable, using the basic one"
            curl -fsSL -o voice.tgz https://github.com/rhasspy/piper/releases/download/v0.0.2/voice-de-thorsten-low.tar.gz
            tar xzf voice.tgz -C voice
            echo "name=de-thorsten-low" >> "$GITHUB_OUTPUT"
          fi

      - name: Reuse recordings from earlier builds
        uses: actions/cache@v4
        with:
          path: site/audio
          key: audio-${{ steps.voice.outputs.name }}-v2-${{ hashFiles('phrases.yml') }}
          restore-keys: audio-${{ steps.voice.outputs.name }}-v2-

      - name: Record phrases and build the page
        run: |
          python scripts/make.py voice/${{ steps.voice.outputs.name }}.onnx phrases.yml site
          touch site/.nojekyll

      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
